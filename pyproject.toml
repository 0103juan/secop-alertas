[project]
name = "secop-alertas"
version = "0.1.0"
description = "Alerts and readings over Colombia's public contracting data (SECOP II), built with Django and Django REST Framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "dj-database-url>=3.0",
    "redis>=6.0",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "httpx>=0.28",
    "pandas>=2.3",
    "numpy>=2.3",
    "scipy>=1.16",
    "google-cloud-pubsub>=2.31",
    "google-auth>=2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
